name: Aktualizuj klipy
on:
  schedule: [{ cron: "0 */3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -U yt-dlp
      - run: node scripts/fetch-clips.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - run: |
          git config user.name "clips-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Aktualizacja klipów" && git push)
